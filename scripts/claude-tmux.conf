# tmux config for the private `nvim-claude` server (scripts/claude-tmux.sh).
# tmux only keeps Claude alive across Neovim restarts; it should otherwise be
# invisible, so every key goes straight to Claude.

set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix

# Without this, Esc in Claude waits for a possible escape sequence.
set -g escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -g extended-keys on
set -g focus-events on

# Wheel scrolling and clicks reach Claude; copying uses OSC 52.
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on

set -g history-limit 50000
